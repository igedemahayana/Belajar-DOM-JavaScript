<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>02 - Selecting Elements</title>
</head>

<body>
  <!-- 
  Latihan 1 — Pemanasan
  - Ambil elemen #container, cetak ke console
  - Ambil elemen .judul (pakai querySelector), cetak textContent-nya
  - Ambil SEMUA .item (pakai querySelectorAll), cetak berapa jumlahnya (.length)
  -->
  <div id="container">
    <h2 class="judul">List Belajar Hari Ini</h2>
    <li class="item">JavaScript ES6+</li>
    <li class="item">JavaScript DOM</li>
    <li class="item">GSAP</li>
  </div>
</body>

<script src="index.js"></script>

</html>
