<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manipulating HTML Elements</title>
</head>

<body>
  <ul id="major">
    <li>Graphic Design</li>
    <li>Software Engineer</li>
  </ul>

  <ul id="productApple">
    <li>IPhone</li>
    <li>MacBook</li>
  </ul>

  <ul class="techStack">
    <li>Figma</li>
    <li>Tailwind</li>
    <li>JavaScript</li>
  </ul>

  <ul id="menuNavbar">
    <li>Home</li>
    <li>About</li>
    <li>Features</li>
    <li style="display: none;">Contact</li>
  </ul>

  <ul id="fruits">
    <li>Orange</li>
    <li>Watermelon</li>
  </ul>

  <ul id="techCompany">
    <li>Timedoor</li>
  </ul>

  <ul id="hobiArum">
    <li>Menggambar</li>
    <li>Digital Art</li>
  </ul>

  <ul id="nameStudent">
    <li>Lixun</li>
    <li>Mahayana</li>
    <li>Arum</li>
    <li>Yu Zahao</li>
  </ul>
</body>

<script>
  // createElement()
  let createDiv = document.createElement("div");
  let createH2 = document.createElement("h2");

  // innerHTML & innerText
  createDiv.innerHTML = "<h2> Hai aku Mahayana </h2>"; // membuat tag beserta isinya
  createH2.innerText = "Hai aku Arum"; // sudah dibuatkan tag html tapi harus di isi

  // appendChild()
  let majors = document.getElementById("major");
  let listMajor = document.createElement("li");
  listMajor.innerText = "Computer Engineer";
  majors.appendChild(listMajor);

  let productApple = document.getElementById("productApple");
  let addProductApple = document.createElement("li");
  addProductApple.innerText = "AirPods";
  productApple.appendChild(addProductApple);

  let techStack = document.querySelector(".techStack");
  let addTechStack = document.createElement("li");
  addTechStack.innerText = "React + TypeScript";
  techStack.appendChild(addTechStack);

  // textContent
  let menuNavbar = document.querySelector("#menuNavbar");

  console.log(createDiv); // Output: Hai aku Mahayana
  console.log(createH2); // Output: Hai aku Arum

  console.log(majors); // Graphic Design, Software Engineer, Computer Engineer
  console.log(productApple) // IPhone, Macbook, AirPods
  console.log(techStack); // Figma, Tailwind, JavaScript, React + TypeScript
  console.log(menuNavbar.textContent); // Home, About, Features, Contact
  console.log(menuNavbar.innerText); // Home, About, Features

  // perbedaan textContent & innerHTML  
  /*
  textContent mengambil semua teks di dalam elemen
  dan anak-anaknya apa adanya seperti yang tertulis di dalam kode HTML,
  termasuk teks yang disembunyikan dengan CSS (display: none).
  */

  /*
  innerText hanya mengambil teks yg benar-benar terlihat
  oleh pengguna di layar, sehingga mengabaikan elemen yg disembunyikan oleh CSS
  */

  // after() -> menyisipkan satu / lebih node setelah elemen
  // Element.after(node) -> "taruh sesuatu setelah elemen ini".
  let fruits = document.querySelector("#fruits");
  fruits.after("Apple");

  let techCompany = document.querySelector("#techCompany");
  let str1 = document.createElement("li");
  let str2 = document.createElement("li");

  str1.textContent = "Koding Next Bali";
  str2.textContent = "John ID";
  techCompany.after(str1, str2);
  // tidak masuk ke div techCompany
  // karena after() setelah element

  // prepend() -> awal isi element
  // parentNode.prepend(newNodes);

  // append() -> akhir isi elemen
  // parentNode.append(newNodes);

  // insertAdjectiveHTML()
  // element.insertAdjacentHTML(positionName, text)
  let hobiArum = document.querySelector("#hobiArum");
  hobiArum.insertAdjacentHTML("beforeend", "<li>Public Speaking</li>")
  hobiArum.insertAdjacentHTML("afterbegin", "<li>Belanja</li>")
  hobiArum.insertAdjacentHTML("afterend", "<li>Makan</li>")
  hobiArum.insertAdjacentHTML("beforebegin", "<li>Jalan Jalan</li>")

  // replaceChild()
  // parentNode.replaceChild(newChild, oldChild);

  // cloneNode()
  let cloneHobiArum = hobiArum.cloneNode(true);
  let cloneTechCompany = techCompany.cloneNode(false);
  console.log(cloneHobiArum);
  console.log(cloneTechCompany);

  // removeChild()
  let student = document.querySelector("#nameStudent");
  student.removeChild(student.lastElementChild);
  student.removeChild(student.firstElementChild);
  console.log(student);

  // insertBefore()

  // NOTE: Belum di commit disini
</script>

</html>
